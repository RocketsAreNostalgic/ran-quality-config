name: Generate lockfile

on:
  push:
    branches:
      - feat/initial-quality-package

permissions:
  contents: read

jobs:
  lock:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'

      - name: Resolve dependency graph and verify package
        run: |
          pnpm install --no-frozen-lockfile
          pnpm peers check
          pnpm check
          npm pack --dry-run --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: lock
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download generated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pnpm-lock
          path: generated

      - name: Commit exact generated lockfile
        run: |
          set -euo pipefail
          cp generated/pnpm-lock.yaml pnpm-lock.yaml
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: lock quality dependencies'
          git push origin HEAD:feat/initial-quality-package
