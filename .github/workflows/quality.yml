name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Node quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          cache: pnpm

      - name: Require locked package manifest and exact pnpm
        env:
          RAN_PNPM_VERSION: '11.13.1'
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-lock.yaml
          declared_pnpm="$(node -p "require('./package.json').packageManager.split('@').slice(1).join('@').split('+')[0]")"
          test "$declared_pnpm" = "$RAN_PNPM_VERSION"
          test "$(pnpm --version)" = "$RAN_PNPM_VERSION"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package quality contract
        run: pnpm check

      - name: Verify packed consumers by tool family
        run: pnpm test:consumer

      - name: Verify publishable package contents
        run: npm pack --dry-run --ignore-scripts

  quality:
    name: quality
    if: ${{ always() }}
    needs: verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require Node quality lane
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
