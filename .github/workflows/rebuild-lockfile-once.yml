name: Rebuild lockfile once

on:
  push:
    branches:
      - chore/finalize-lockfile-bootstrap

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor == 'bnjmnrsh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Verify trusted branch revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "${GITHUB_REF_NAME}" = "chore/finalize-lockfile-bootstrap"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'

      - name: Rebuild and verify exact lockfile
        env:
          EXPECTED_LOCK_SHA256: 177d3d4187c09aeaeea27f0d8cb9fe4c6ec01925d7e2aed8294480e6630b5644
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          actual="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          test "$actual" = "$EXPECTED_LOCK_SHA256"

      - name: Commit lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/rebuild-lockfile-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: finalize pnpm lockfile"
          git push origin HEAD:chore/finalize-lockfile-bootstrap
